name: Daily Career Source Refresh

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-career-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Discover links from public career portals
        run: node scripts/career-refresh.mjs
      - name: Commit refreshed public feed
        run: |
          if git diff --quiet -- public/career-jobs.json; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/career-jobs.json
          git commit -m "chore: refresh public career source feed"
          git push
